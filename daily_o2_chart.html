<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Anti-Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>NKP Medical Oxygen Analytics Dashboard V14</title>
    <!-- Fonts & Icons & CDNs -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-body: #070b14;
            --bg-sidebar: #0e1626;
            --bg-card: rgba(20, 30, 48, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --table-header-bg: rgba(15, 23, 42, 0.95);
            --input-bg: rgba(30, 41, 59, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.4);

            --color-nkp: #06b6d4;
            --bg-nkp: rgba(6, 182, 212, 0.12);
            --color-khon: #a855f7;
            --bg-khon: rgba(168, 85, 247, 0.12);
            --color-total: #10b981;
            --bg-total: rgba(16, 185, 129, 0.12);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-cyan: #0284c7;
            --accent-emerald: #059669;
            --accent-purple: #7e22ce;
            --accent-amber: #d97706;
            --accent-rose: #e11d48;
            --table-header-bg: #e2e8f0;
            --input-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);

            --color-nkp: #0284c7;
            --bg-nkp: #e0f2fe;
            --color-khon: #7e22ce;
            --bg-khon: #f3e8ff;
            --color-total: #059669;
            --bg-total: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, width 0.3s ease;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .sidebar {
            width: 290px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.25rem 0.85rem;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
            box-shadow: 4px 0 20px var(--shadow-color);
        }

        .sidebar.collapsed { width: 78px; }

        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
        }

        .brand-info { display: flex; align-items: center; gap: 0.75rem; overflow: hidden; }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--accent-emerald));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
            flex-shrink: 0;
        }

        .brand-text h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .brand-text p { font-size: 0.75rem; color: var(--text-muted); }
        .sidebar.collapsed .brand-text { display: none; }

        .sidebar-toggle-btn {
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }

        .menu-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.85rem 1rem;
            font-size: 0.92rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            text-align: left;
            width: 100%;
            white-space: nowrap;
        }

        .menu-item i { font-size: 1.25rem; width: 26px; text-align: center; flex-shrink: 0; }
        .sidebar.collapsed .menu-item span { display: none; }
        .sidebar.collapsed .menu-item { justify-content: center; padding: 0.85rem 0; }

        .menu-item:hover {
            background: rgba(6, 182, 212, 0.12);
            color: var(--primary-cyan);
            transform: translateX(4px);
        }

        .menu-item.active {
            background: linear-gradient(135deg, var(--primary-cyan), #0284c7);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
        }

        .sidebar-btn-export {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 0.85rem 1rem;
            font-size: 0.92rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            white-space: nowrap;
        }

        .sidebar-btn-export i { font-size: 1.25rem; width: 26px; text-align: center; flex-shrink: 0; }
        .sidebar.collapsed .sidebar-btn-export span { display: none; }
        .sidebar.collapsed .sidebar-btn-export { justify-content: center; padding: 0.85rem 0; }
        .sidebar-btn-export:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        .sidebar-footer {
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar.collapsed .sidebar-footer { display: none; }

        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }

        .top-header {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 4px 15px var(--shadow-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title-box h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
        .header-title-box p { font-size: 0.82rem; color: var(--text-muted); }

        .header-controls { display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap; }

        .live-clock-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(16, 185, 129, 0.12));
            border: 1px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 0.45rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .clock-icon { font-size: 1.4rem; color: var(--primary-cyan); }
        .clock-time { font-size: 1.15rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
        .clock-date { font-size: 0.75rem; color: var(--text-muted); }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content-body { padding: 1.75rem 2rem; flex-grow: 1; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }

        .kpi-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            position: relative;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .kpi-icon { position: absolute; top: 1.25rem; right: 1.25rem; font-size: 1.8rem; opacity: 0.3; }
        .kpi-label { color: var(--text-muted); font-size: 0.88rem; font-weight: 500; }
        .kpi-value { font-size: 1.9rem; font-weight: 700; margin: 0.3rem 0; }
        .kpi-subtext { font-size: 0.82rem; color: var(--text-muted); }

        .content-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .unit-selector { display: flex; gap: 0.35rem; background: var(--input-bg); padding: 0.25rem; border-radius: 10px; border: 1px solid var(--border-color); }
        .btn-unit { background: transparent; border: none; color: var(--text-muted); padding: 0.35rem 0.75rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
        .btn-unit.active { background: var(--primary-cyan); color: #000000; box-shadow: 0 2px 8px rgba(6, 182, 212, 0.4); }

        .th-nkp { background: var(--bg-nkp) !important; color: var(--color-nkp) !important; border-bottom: 2px solid var(--color-nkp); }
        .th-khon { background: var(--bg-khon) !important; color: var(--color-khon) !important; border-bottom: 2px solid var(--color-khon); }
        .th-total { background: var(--bg-total) !important; color: var(--color-total) !important; border-bottom: 2px solid var(--color-total); }

        .td-nkp { color: var(--color-nkp); font-weight: 600; }
        .td-khon { color: var(--color-khon); font-weight: 600; }
        .td-total { color: var(--color-total); font-weight: 700; }

        .chart-container { position: relative; height: 420px; width: 100%; }

        .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .calc-box { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.65rem 1rem; color: var(--text-main); font-size: 1rem; outline: none; }

        .res-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px dashed var(--border-color); }
        .res-label { font-size: 0.92rem; color: var(--text-muted); }
        .res-val { font-size: 1.15rem; font-weight: 700; color: var(--primary-cyan); }

        .table-wrapper { overflow-x: auto; max-height: 440px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: var(--table-header-bg); color: var(--primary-cyan); padding: 0.85rem 1rem; font-weight: 600; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background: rgba(6, 182, 212, 0.04); }

        .tag-peak { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.75rem; }
        .drop-zone { border: 2px dashed var(--primary-cyan); border-radius: 16px; padding: 2.5rem; text-align: center; background: rgba(6, 182, 212, 0.04); cursor: pointer; }
        #fileInput { display: none; }

        /* HOVER MAGNIFIER & BUILDING MAP STYLES */
        .img-magnifier-container {
            position: relative;
            display: inline-block;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000000;
        }
        .img-magnifier-glass {
            position: absolute;
            border: 3px solid var(--primary-cyan);
            border-radius: 50%;
            cursor: none;
            width: 180px;
            height: 180px;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
            display: none;
            pointer-events: none;
            z-index: 1000;
        }

        .building-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .building-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.35rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .building-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 35px var(--shadow-color);
            border-color: var(--primary-cyan);
        }

        .building-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
        }

        .seq-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.2);
            color: var(--primary-cyan);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 0.5rem;
        }

        .load-box {
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            margin-top: 0.65rem;
            margin-bottom: 0.65rem;
        }
    </style>
</head>
<body>
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar" id="appSidebar">
        <div class="sidebar-brand">
            <div class="brand-info">
                <div class="brand-logo"><i class="fa-solid fa-hospital-user"></i></div>
                <div class="brand-text">
                    <h2>NKP Medical Gas</h2>
                    <p>โรงพยาบาลนครพิงค์</p>
                </div>
            </div>
            <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="ย่อ / ขยาย เมนู">
                <i class="fa-solid fa-angles-left" id="toggleIcon"></i>
            </button>
        </div>

        <nav class="sidebar-menu">
            <button class="menu-item active" id="menu-daily" onclick="switchTab('daily')" title="1. วิเคราะห์รายวัน (91 วัน)">
                <i class="fa-solid fa-chart-line" style="color: var(--primary-cyan);"></i>
                <span>1. วิเคราะห์รายวัน (91 วัน)</span>
            </button>
            <button class="menu-item" id="menu-monthly" onclick="switchTab('monthly')" title="2. สถิติประวัติรายเดือน">
                <i class="fa-solid fa-calendar-days" style="color: var(--accent-emerald);"></i>
                <span>2. สถิติประวัติรายเดือน</span>
            </button>
            <button class="menu-item" id="menu-cost" onclick="switchTab('cost')" title="3. เปรียบเทียบต้นทุน (LOX/6Q)">
                <i class="fa-solid fa-calculator" style="color: var(--accent-amber);"></i>
                <span>3. เปรียบเทียบต้นทุน (LOX/6Q)</span>
            </button>
            <button class="menu-item" id="menu-emergency" onclick="switchTab('emergency')" title="4. แผนก๊าซสำรอง & ผังจ่ายกลาง">
                <i class="fa-solid fa-shield-cat" style="color: var(--accent-rose);"></i>
                <span>4. แผนก๊าซสำรอง & ผังจ่ายกลาง</span>
            </button>
            <button class="menu-item" id="menu-import" onclick="switchTab('import')" title="5. นำเข้า/ส่งออก Excel">
                <i class="fa-solid fa-file-import" style="color: var(--accent-purple);"></i>
                <span>5. นำเข้า/ส่งออก Excel</span>
            </button>

            <!-- Export Excel Button inside Left Sidebar Menu -->
            <button class="sidebar-btn-export" onclick="exportMonthlyExcel()" title="Export Excel สรุปรายเดือน">
                <i class="fa-solid fa-file-excel"></i>
                <span>Export Excel สรุปรายเดือน</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            ออกแบบและจัดทำโดย<br><strong>กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์</strong><br>หมวดงานเครื่องมือแพทย์ โรงพยาบาลนครพิงค์
        </div>
    </aside>

    <div class="main-wrapper">
        <!-- Top Header Bar -->
        <header class="top-header">
            <div class="header-title-box">
                <h1 id="pageTitleText">NKP Medical Oxygen Analytics Dashboard</h1>
                <p id="pageSubTitleText">กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์ หมวดงานเครื่องมือแพทย์ โรงพยาบาลนครพิงค์</p>
            </div>

            <div class="header-controls">
                <div class="live-clock-card">
                    <i class="fa-regular fa-clock clock-icon"></i>
                    <div>
                        <div class="clock-time" id="clockTime">--:--:--</div>
                        <div class="clock-date" id="clockDate">กำลังโหลด...</div>
                    </div>
                </div>

                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon" id="themeIcon"></i> <span id="themeText">โหมดมืด</span>
                </button>
            </div>
        </header>

        <main class="content-body">
            <div class="kpi-grid" id="kpiGrid"></div>
            <div id="moduleContent"></div>
        </main>

        function updateCostCalc() {
            const loxEl = document.getElementById('cost-lox-unit');
            const cylEl = document.getElementById('cost-cyl-unit');
            if (!loxEl || !cylEl) return;

            const loxP = parseFloat(loxEl.value) || 10.90;
            const cylP = parseFloat(cylEl.value) || 100.00;
            const cylV = 6.0;

            const cylPerM3 = cylP / cylV;
            const loxEquiv = loxP * cylV;
            const savePerCyl = cylP - loxEquiv;
            const pctSave = (savePerCyl / cylP) * 100;

            const dailyM3 = db.daily.stats.avg_nkp_m3;
            const dailyCylCount = dailyM3 / cylV;
            const dailyCostLOX = dailyM3 * loxP;
            const dailyCostCyl = dailyCylCount * cylP;
            const dailySave = dailyCostCyl - dailyCostLOX;
            const yearlySave = dailySave * 365;

            const r1 = document.getElementById('res-cyl-m3');
            const r2 = document.getElementById('res-lox-equiv');
            const r3 = document.getElementById('res-save-cyl');
            const r4 = document.getElementById('res-pct-save');
            const r5 = document.getElementById('res-daily-save');
            const r6 = document.getElementById('res-yearly-save');

            if (r1) r1.innerText = cylPerM3.toFixed(2) + " บาท/m³";
            if (r2) r2.innerText = loxEquiv.toFixed(2) + " บาท";
            if (r3) r3.innerText = "ประหยัด " + savePerCyl.toFixed(2) + " บาท";
            if (r4) r4.innerText = pctSave.toFixed(2) + "%";
            if (r5) r5.innerText = dailySave.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/วัน";
            if (r6) r6.innerText = yearlySave.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/ปี";
        }

                                <label class="form-label">จำนวนวันที่ต้องสำรองแก๊สฉุกเฉิน (วัน):</label>
                                <input type="number" class="form-control" id="em-days" value="1" min="1" max="30" oninput="updateEmergencyCalc()">
                            </div>
                        </div>

                        <div class="calc-box">
                            <h3 style="color: var(--accent-emerald); margin-bottom: 1rem;">2. ผลการคำนวณความต้องการออกซิเจนฉุกเฉิน</h3>
                            <div class="res-row">
                                <span class="res-label">ปริมาณก๊าซออกซิเจนรวมที่ต้องการ:</span>
                                <span class="res-val" id="em-res-m3">2,447.66 m³</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">ปริมาณออกซิเจนเหลว (LOX Liquid Liters):</span>
                                <span class="res-val" id="em-res-lox-l">2,846.12 ลิตร</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">น้ำหนักออกซิเจนเหลว (LOX Weight):</span>
                                <span class="res-val" id="em-res-lox-kg">3,241.93 Kg</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">จำนวนท่อออกซิเจน 6Q (2,000 PSI) ที่ต้องใช้:</span>
                                <span class="res-val" style="color: var(--accent-amber);" id="em-res-cyl6">409 ท่อ</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">จำนวนท่อออกซิเจน 7Q ที่ต้องใช้:</span>
                                <span class="res-val" style="color: var(--accent-amber);" id="em-res-cyl7">350 ท่อ</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">อัตราการสับเปลี่ยนท่อฉุกเฉินเฉลี่ย:</span>
                                <span class="res-val" style="color: var(--accent-rose);" id="em-res-rate">17 ท่อ / ชั่วโมง</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">ประมาณการค่าใช้จ่ายจัดซื้อท่อฉุกเฉิน:</span>
                                <span class="res-val" style="color: var(--accent-rose); font-size: 1.25rem;" id="em-res-cost">40,900 บาท</span>

                    </div>
                </div>
            `;
            updateEmergencyCalc();

            // Enable Magnifier Lenses for both diagrams
            setTimeout(() => {
                enableMagnifier("magImg1", "magGlass1", "magContainer1");
                enableMagnifier("magImg2", "magGlass2", "magContainer2");
            }, 200);
        }

        function enableMagnifier(imgID, glassID, containerID) {
            const img = document.getElementById(imgID);
            const glass = document.getElementById(glassID);
            const container = document.getElementById(containerID);
            if (!img || !glass || !container) return;

            const zoom = 2.2;
            glass.style.backgroundImage = "url('" + img.src + "')";
            glass.style.backgroundRepeat = "no-repeat";
            glass.style.backgroundSize = (img.width * zoom) + "px " + (img.height * zoom) + "px";

            container.onmouseenter = function() { glass.style.display = "block"; };
            container.onmouseleave = function() { glass.style.display = "none"; };
            container.onmousemove = function(e) {
                const rect = img.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;

                let w = glass.offsetWidth / 2;
                let h = glass.offsetHeight / 2;

                if (x > img.width - w) x = img.width - w;
                if (x < w) x = w;
                if (y > img.height - h) y = img.height - h;
                if (y < h) y = h;

                glass.style.left = (x - w) + "px";
                glass.style.top = (y - h) + "px";
                glass.style.backgroundPosition = "-" + ((x * zoom) - w) + "px -" + ((y * zoom) - h) + "px";
            };
        }

        function updateEmergencyCalc() {
            const targetEl = document.getElementById('em-target');
            const levelEl = document.getElementById('em-level');
            const daysEl = document.getElementById('em-days');
            if (!targetEl || !levelEl || !daysEl) return;

            const target = targetEl.value;
            const level = levelEl.value;
            const days = parseFloat(daysEl.value) || 1;

            let dailyM3 = 0;
            if (target === 'nkp') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_nkp_m3 : (db.daily.stats.avg_nkp_m3 * 1.15);
            } else if (target === 'khon') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_khon_m3 : (db.daily.stats.avg_khon_m3 * 1.70);
            } else {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_total_m3 : db.daily.stats.max_total_m3;
            }

            const totalM3 = dailyM3 * days;
            const loxKg = totalM3 / 0.755;
            const loxLiters = loxKg / 1.141;
            const cyl6 = Math.ceil(totalM3 / 6.0);
            const cyl7 = Math.ceil(totalM3 / 7.0);
            const ratePerHour = Math.ceil(cyl6 / (days * 24));
            const costCyl = cyl6 * 100;

            const r1 = document.getElementById('em-res-m3');
            const r2 = document.getElementById('em-res-lox-l');
            const r3 = document.getElementById('em-res-lox-kg');
            const r4 = document.getElementById('em-res-cyl6');
            const r5 = document.getElementById('em-res-cyl7');
            const r6 = document.getElementById('em-res-rate');
            const r7 = document.getElementById('em-res-cost');

            if (r1) r1.innerText = totalM3.toLocaleString(undefined, {maximumFractionDigits: 2}) + " m³";
            if (r2) r2.innerText = loxLiters.toLocaleString(undefined, {maximumFractionDigits: 2}) + " ลิตรเหลว";
            if (r3) r3.innerText = loxKg.toLocaleString(undefined, {maximumFractionDigits: 2}) + " Kg";
            if (r4) r4.innerText = cyl6.toLocaleString() + " ท่อ";
            if (r5) r5.innerText = cyl7.toLocaleString() + " ท่อ";
            if (r6) r6.innerText = ratePerHour.toLocaleString() + " ท่อ / ชั่วโมง";
            if (r7) r7.innerText = costCyl.toLocaleString() + " บาท";
        }

        function renderImportModule() {
            const content = document.getElementById('moduleContent');
            if (!content) return;

            const isCustomData = !!localStorage.getItem('nkp_o2_db_v4');

            content.innerHTML = `
                <div class="content-card">
                    <div class="section-title">
                        <div><i class="fa-solid fa-file-excel" style="color: var(--accent-emerald);"></i> โมดูลนำเข้า & ส่งออกไฟล์ Excel (Excel Import / Export)</div>
                        <div style="display: flex; gap: 0.5rem;">
                            ${isCustomData ? `
                            <button class="btn-export-excel" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; padding: 0.55rem 1.1rem; border-radius: 10px; cursor: pointer; font-weight: 600;" onclick="resetToDefaultData()">
                                <i class="fa-solid fa-rotate-left"></i> คืนค่าข้อมูลเริ่มต้น
                            </button>
                            ` : ''}
                            <button class="btn-export-excel" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 0.55rem 1.1rem; border-radius: 10px; cursor: pointer; font-weight: 600;" onclick="exportMonthlyExcel()">
                                <i class="fa-solid fa-file-excel"></i> Export Excel (เฉพาะ m³)
                            </button>
                        </div>
                    </div>
                    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                        <i class="fa-file-excel" style="font-size: 3.5rem; color: var(--accent-emerald); margin-bottom: 1rem;"></i>
                        <h3>คลิกหรือลากไฟล์ Excel โทรมาตรมาวางเพื่ออัปเดต</h3>
                        <p style="color: var(--text-muted); margin-top: 0.5rem;">รองรับไฟล์ NPPH10011-History-*.xlsx (รพ.นครพิงค์) และ NPPH20011-History-*.xlsx (ศูนย์มะเร็งขอนตาล)</p>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx, .xls" multiple onchange="handleFileSelect(event)">
                </div>
            `;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            const dz = document.getElementById('dropZone');
            if (dz) dz.style.borderColor = 'var(--primary-cyan)';
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            const dz = document.getElementById('dropZone');
            if (dz) dz.style.borderColor = '';
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            const dz = document.getElementById('dropZone');
            if (dz) dz.style.borderColor = '';

            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                processExcelFiles(files);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                processExcelFiles(files);
            }
        }

        function resetToDefaultData() {
            if (confirm("คุณต้องการล้างข้อมูลที่อัปโหลดและคืนค่าเป็นฐานข้อมูลเริ่มต้นหรือไม่?")) {
                localStorage.removeItem('nkp_o2_db_v4');
                db = JSON.parse(JSON.stringify(initialDefaultDB));
                renderKPIs();
                renderModule();
                alert("คืนค่าฐานข้อมูลเริ่มต้นเรียบร้อยแล้ว");
            }
        }

        function processExcelFiles(files) {
            const fileList = Array.from(files);
            let processedCount = 0;
            let successMsgs = [];
            let errorMsgs = [];

            fileList.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

                        const result = parseTelemetryRows(jsonRows, file.name);
                        if (result.success) {
                            successMsgs.push(result.message);
                        } else {
                            errorMsgs.push(`${file.name}: ${result.error}`);
                        }
                    } catch (err) {
                        console.error("File parse error:", err);
                        errorMsgs.push(`${file.name}: เกิดข้อผิดพลาดในการอ่านไฟล์ (${err.message})`);
                    }

                    processedCount++;
                    if (processedCount === fileList.length) {
                        if (successMsgs.length > 0) {
                            recalculateAllDB();
                            localStorage.setItem('nkp_o2_db_v4', JSON.stringify(db));
                            renderKPIs();
                            renderModule();
                            let msg = "🎉 นำเข้าและประมวลผลไฟล์ Excel สำเร็จ!\n\n" + successMsgs.join("\n");
                            if (errorMsgs.length > 0) {
                                msg += "\n\n⚠️ คำเตือนสำหรับบางไฟล์:\n" + errorMsgs.join("\n");
                            }
                            alert(msg);
                            switchTab('daily');
                        } else if (errorMsgs.length > 0) {
                            alert("❌ ไม่สามารถนำเข้าไฟล์ได้:\n\n" + errorMsgs.join("\n"));
                        }
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function parseTelemetryRows(jsonRows, filename) {
            if (!jsonRows || jsonRows.length < 5) {
                return { success: false, error: "ไฟล์ไม่มีข้อมูลเพียงพอ" };
            }

            // Detect tank site
            let targetKey = null; // 'nkp' or 'khon'
            for (let i = 0; i < Math.min(5, jsonRows.length); i++) {
                const rowStr = (jsonRows[i] || []).join(' ');
                if (rowStr.includes('NPPH10011')) targetKey = 'nkp';
                if (rowStr.includes('NPPH20011')) targetKey = 'khon';
            }
            if (!targetKey) {
                if (filename.includes('NPPH10011')) targetKey = 'nkp';
                else if (filename.includes('NPPH20011')) targetKey = 'khon';
            }
            if (!targetKey) {
                return { success: false, error: "ไม่พบรหัสถังโทรมาตร (NPPH10011 หรือ NPPH20011) ในไฟล์" };
            }

            // Find header row containing 'Post Date'
            let headerIdx = -1;
            for (let i = 0; i < jsonRows.length; i++) {
                const r = jsonRows[i];
                if (r && r[0] && String(r[0]).trim().toLowerCase().includes('post date')) {
                    headerIdx = i;
                    break;
                }
            }
            if (headerIdx === -1) {
                return { success: false, error: "ไม่พบคอลัมน์ 'Post Date' ในไฟล์ Excel" };
            }

            // Extract entries
            const entries = [];
            for (let i = headerIdx + 1; i < jsonRows.length; i++) {
                const r = jsonRows[i];
                if (!r || !r[0]) continue;
                const dtStr = String(r[0]).trim();
                if (!dtStr || dtStr === 'None' || dtStr === 'Post Date') continue;

                let wtVal = 0;
                if (r[2] !== undefined && r[2] !== null) {
                    const cleanWt = String(r[2]).replace(/Kg/gi, '').replace(/,/g, '').trim();
                    wtVal = parseFloat(cleanWt) || 0;
                }

                if (wtVal > 0) { // Filter out invalid sensor disconnects/errors (<= 0)
                    const datePart = dtStr.split(' ')[0];
                    entries.push({ datetime: dtStr, date: datePart, weight: wtVal });
                }
            }

            if (entries.length === 0) {
                return { success: false, error: "ไม่พบแถวข้อมูลวันเวลาและน้ำหนักก๊าซ" };
            }

            // Sort chronologically
            entries.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

            // Group by date and calculate positive weight drops
            const dailyUsage = {};
            const grouped = {};
            entries.forEach(item => {
                if (!grouped[item.date]) grouped[item.date] = [];
                grouped[item.date].push(item);
            });

            for (const d in grouped) {
                const list = grouped[d];
                let totalDrop = 0;
                for (let i = 0; i < list.length - 1; i++) {
                    const diff = list[i].weight - list[i + 1].weight;
                    if (diff > 0) totalDrop += diff;
                }
                dailyUsage[d] = Math.round(totalDrop * 100) / 100;
            }

            // Merge into db.daily
            let updatedDays = 0;
            for (const d in dailyUsage) {
                const kg = dailyUsage[d];
                const m3 = Math.round(kg * 0.755 * 100) / 100;
                let idx = db.daily.dates.indexOf(d);

                if (idx === -1) {
                    let insertIdx = db.daily.dates.findIndex(dateStr => dateStr > d);
                    if (insertIdx === -1) insertIdx = db.daily.dates.length;

                    db.daily.dates.splice(insertIdx, 0, d);
                    db.daily.nkp_kg.splice(insertIdx, 0, targetKey === 'nkp' ? kg : 0);
                    db.daily.nkp_m3.splice(insertIdx, 0, targetKey === 'nkp' ? m3 : 0);
                    db.daily.khon_kg.splice(insertIdx, 0, targetKey === 'khon' ? kg : 0);
                    db.daily.khon_m3.splice(insertIdx, 0, targetKey === 'khon' ? m3 : 0);
                    db.daily.total_kg.splice(insertIdx, 0, kg);
                    db.daily.total_m3.splice(insertIdx, 0, m3);
                } else {
                    if (targetKey === 'nkp') {
                        db.daily.nkp_kg[idx] = kg;
                        db.daily.nkp_m3[idx] = m3;
                    } else {
                        db.daily.khon_kg[idx] = kg;
                        db.daily.khon_m3[idx] = m3;
                    }
                    db.daily.total_kg[idx] = Math.round((db.daily.nkp_kg[idx] + db.daily.khon_kg[idx]) * 100) / 100;
                    db.daily.total_m3[idx] = Math.round((db.daily.nkp_m3[idx] + db.daily.khon_m3[idx]) * 100) / 100;
                }
                updatedDays++;
            }

            const tankName = targetKey === 'nkp' ? "โรงพยาบาลนครพิงค์ (NPPH10011)" : "ศูนย์มะเร็งขอนตาล (NPPH20011)";
            return {
                success: true,
                message: `• ${tankName}: ประมวลผลสำเร็จ ${updatedDays} วัน (รวม ${entries.length} แถวบันทึก)`
            };
        }

        function recalculateAllDB() {
            // Recompute total_kg and total_m3 for all daily entries
            db.daily.total_kg = db.daily.nkp_kg.map((k, i) => Math.round((k + db.daily.khon_kg[i]) * 100) / 100);
            db.daily.total_m3 = db.daily.nkp_m3.map((m, i) => Math.round((m + db.daily.khon_m3[i]) * 100) / 100);

            // Recompute daily stats
            const count = db.daily.dates.length || 1;
            const sumNkpKg = db.daily.nkp_kg.reduce((a, b) => a + b, 0);
            const sumNkpM3 = db.daily.nkp_m3.reduce((a, b) => a + b, 0);
            const sumKhonKg = db.daily.khon_kg.reduce((a, b) => a + b, 0);
            const sumKhonM3 = db.daily.khon_m3.reduce((a, b) => a + b, 0);
            const sumTotalKg = db.daily.total_kg.reduce((a, b) => a + b, 0);
            const sumTotalM3 = db.daily.total_m3.reduce((a, b) => a + b, 0);

            let maxTotalKg = 0, maxTotalM3 = 0, maxTotalDate = "";
            let minTotalKg = Infinity, minTotalM3 = Infinity, minTotalDate = "";

            db.daily.dates.forEach((d, i) => {
                const tKg = db.daily.total_kg[i];
                const tM3 = db.daily.total_m3[i];
                if (tKg > maxTotalKg) { maxTotalKg = tKg; maxTotalM3 = tM3; maxTotalDate = d; }
                if (tKg < minTotalKg) { minTotalKg = tKg; minTotalM3 = tM3; minTotalDate = d; }
            });

            db.daily.stats = {
                avg_nkp_kg: Math.round((sumNkpKg / count) * 100) / 100,
                avg_nkp_m3: Math.round((sumNkpM3 / count) * 100) / 100,
                avg_khon_kg: Math.round((sumKhonKg / count) * 100) / 100,
                avg_khon_m3: Math.round((sumKhonM3 / count) * 100) / 100,
                avg_total_kg: Math.round((sumTotalKg / count) * 100) / 100,
                avg_total_m3: Math.round((sumTotalM3 / count) * 100) / 100,
                max_total_kg: maxTotalKg,
                max_total_m3: maxTotalM3,
                max_total_date: maxTotalDate,
                min_total_kg: minTotalKg === Infinity ? 0 : minTotalKg,
                min_total_m3: minTotalM3 === Infinity ? 0 : minTotalM3,
                min_total_date: minTotalDate
            };

            // Recompute monthly dataset from daily records
            const monthMap = {};
            const thMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

            db.daily.dates.forEach((dStr, i) => {
                const parts = dStr.split('-');
                if (parts.length < 2) return;
                const yearNum = parseInt(parts[0], 10);
                const monthNum = parseInt(parts[1], 10) - 1;
                const beYearShort = (yearNum + 543) % 100;
                const monthLabel = `${thMonths[monthNum]} ${beYearShort}`;

                if (!monthMap[monthLabel]) {
                    monthMap[monthLabel] = { nkp_m3: 0, khon_m3: 0, total_m3: 0 };
                }
                monthMap[monthLabel].nkp_m3 += db.daily.nkp_m3[i];
                monthMap[monthLabel].khon_m3 += db.daily.khon_m3[i];
                monthMap[monthLabel].total_m3 += db.daily.total_m3[i];
            });

            // Update db.monthly for mapped months
            for (const mLabel in monthMap) {
                const mIdx = db.monthly.months.findIndex(m => m.replace(/\s+/g, '') === mLabel.replace(/\s+/g, '') || m.startsWith(mLabel.split(' ')[0]));
                if (mIdx !== -1) {
                    db.monthly.nkp_m3[mIdx] = Math.round(monthMap[mLabel].nkp_m3 * 100) / 100;
                    db.monthly.khon_m3[mIdx] = Math.round(monthMap[mLabel].khon_m3 * 100) / 100;
                    db.monthly.total_m3[mIdx] = Math.round(monthMap[mLabel].total_m3 * 100) / 100;
                }
            }

            const mCount = db.monthly.months.length || 1;
            const sumMTotal = db.monthly.total_m3.reduce((a, b) => a + b, 0);
            let maxM3 = 0, maxMMonth = "", minM3 = Infinity, minMMonth = "";
            db.monthly.total_m3.forEach((val, idx) => {
                if (val > maxM3) { maxM3 = val; maxMMonth = db.monthly.months[idx]; }
                if (val < minM3) { minM3 = val; minMMonth = db.monthly.months[idx]; }
            });

            db.monthly.avg_total_m3 = Math.round((sumMTotal / mCount) * 100) / 100;
            db.monthly.max_m3 = maxM3;
            db.monthly.max_month = maxMMonth;
            db.monthly.min_m3 = minM3 === Infinity ? 0 : minM3;
            db.monthly.min_month = minMMonth;
        }

        // Safe Initialization on Window Load
        window.onload = function() {
            try {
                updateLiveClock();
                setInterval(updateLiveClock, 1000);
                renderKPIs();
                renderModule();
            } catch (err) {
                console.error("Dashboard Init Error:", err);
            }
        };
    </script>
