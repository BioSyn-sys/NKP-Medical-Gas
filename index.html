<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Anti-Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>NKP Medical Oxygen Analytics Dashboard</title>
    
    <!-- Fonts & Icons & CDNs -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-body: #070b14;
            --bg-sidebar: #0e1626;
            --bg-card: rgba(14, 22, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(6, 182, 212, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --table-header-bg: rgba(15, 23, 42, 0.95);
            --input-bg: rgba(30, 41, 59, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.4);

            --color-nkp: #06b6d4;
            --bg-nkp: rgba(6, 182, 212, 0.12);
            --color-khon: #a855f7;
            --bg-khon: rgba(168, 85, 247, 0.12);
            --color-total: #10b981;
            --bg-total: rgba(16, 185, 129, 0.12);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-cyan: #0284c7;
            --accent-emerald: #059669;
            --accent-purple: #7e22ce;
            --accent-amber: #d97706;
            --accent-rose: #e11d48;
            --table-header-bg: #e2e8f0;
            --input-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);

            --color-nkp: #0284c7;
            --bg-nkp: #e0f2fe;
            --color-khon: #7e22ce;
            --bg-khon: #f3e8ff;
            --color-total: #059669;
            --bg-total: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* -------------------------------------------------------------
           COLLAPSIBLE SIDEBAR MENU (ย่อ-ขยายได้ ลื่นไหล 144Hz)
           ------------------------------------------------------------- */
        .sidebar {
            width: 270px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.25rem 0.85rem;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
            box-shadow: 4px 0 20px var(--shadow-color);
            will-change: width;
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed { 
            width: 78px; 
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.1rem;
        }

        .brand-info { 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            overflow: hidden; 
            white-space: nowrap;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--accent-emerald));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
            flex-shrink: 0;
        }

        .brand-text h2 { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
        .brand-text p { font-size: 0.72rem; color: var(--text-muted); }
        .sidebar.collapsed .brand-text { display: none; }

        .sidebar-toggle-btn {
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .sidebar-toggle-btn:hover {
            transform: scale(1.05);
            background: rgba(6, 182, 212, 0.25);
        }

        .sidebar-menu { 
            display: flex; 
            flex-direction: column; 
            gap: 0.45rem; 
            flex-grow: 1; 
        }

        .menu-item {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 0.75rem 0.9rem;
            font-size: 0.88rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-align: left;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item i { 
            font-size: 1.15rem; 
            width: 24px; 
            text-align: center; 
            flex-shrink: 0; 
        }

        .sidebar.collapsed .menu-item span { display: none; }
        .sidebar.collapsed .menu-item { justify-content: center; padding: 0.75rem 0; }

        .menu-item:hover {
            background: rgba(6, 182, 212, 0.12);
            color: var(--primary-cyan);
            border-color: rgba(6, 182, 212, 0.2);
            transform: translateX(3px);
        }

        .sidebar.collapsed .menu-item:hover {
            transform: none;
        }

        .menu-item.active {
            background: linear-gradient(135deg, var(--primary-cyan), #0284c7);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .menu-item.active i { color: #ffffff !important; }

        .sidebar-btn-export {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 0.75rem 0.9rem;
            font-size: 0.88rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            margin-top: 0.4rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .sidebar-btn-export i { font-size: 1.15rem; width: 24px; text-align: center; flex-shrink: 0; }
        .sidebar.collapsed .sidebar-btn-export span { display: none; }
        .sidebar.collapsed .sidebar-btn-export { justify-content: center; padding: 0.75rem 0; }
        .sidebar-btn-export:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        .sidebar-footer {
            padding-top: 0.85rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar.collapsed .sidebar-footer { display: none; }

        /* -------------------------------------------------------------
           MAIN CONTENT LAYOUT & TOP HEADER
           ------------------------------------------------------------- */
        .main-wrapper { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0; 
        }

        .top-header {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 4px 15px var(--shadow-color);
            flex-wrap: wrap;
            gap: 0.85rem;
        }

        .header-title-box h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .header-title-box p { font-size: 0.78rem; color: var(--text-muted); }

        .header-controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

        .live-clock-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(16, 185, 129, 0.12));
            border: 1px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 0.4rem 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .clock-icon { font-size: 1.2rem; color: var(--primary-cyan); }
        .clock-time { font-size: 1.05rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
        .clock-date { font-size: 0.72rem; color: var(--text-muted); }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.45rem 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            transition: background 0.2s ease;
        }
        .theme-toggle-btn:hover { background: rgba(6, 182, 212, 0.15); }

        .content-body { 
            padding: 1.5rem; 
            flex-grow: 1; 
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* -------------------------------------------------------------
           KPI CARDS & CONTENT CARDS
           ------------------------------------------------------------- */
        .kpi-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 1.1rem; 
            margin-bottom: 1.35rem; 
        }

        .kpi-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.15rem 1.35rem;
            position: relative;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .kpi-icon { position: absolute; top: 1.15rem; right: 1.15rem; font-size: 1.7rem; opacity: 0.35; }
        .kpi-label { color: var(--text-muted); font-size: 0.82rem; font-weight: 500; }
        .kpi-value { font-size: 1.75rem; font-weight: 700; margin: 0.25rem 0; }
        .kpi-subtext { font-size: 0.78rem; color: var(--text-muted); }

        .content-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.35rem;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .unit-selector { display: flex; gap: 0.3rem; background: var(--input-bg); padding: 0.2rem; border-radius: 10px; border: 1px solid var(--border-color); }
        .btn-unit { background: transparent; border: none; color: var(--text-muted); padding: 0.3rem 0.65rem; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .btn-unit.active { background: var(--primary-cyan); color: #000000; box-shadow: 0 2px 8px rgba(6, 182, 212, 0.4); }

        .th-nkp { background: var(--bg-nkp) !important; color: var(--color-nkp) !important; border-bottom: 2px solid var(--color-nkp); }
        .th-khon { background: var(--bg-khon) !important; color: var(--color-khon) !important; border-bottom: 2px solid var(--color-khon); }
        .th-total { background: var(--bg-total) !important; color: var(--color-total) !important; border-bottom: 2px solid var(--color-total); }

        .td-nkp { color: var(--color-nkp); font-weight: 600; }
        .td-khon { color: var(--color-khon); font-weight: 600; }
        .td-total { color: var(--color-total); font-weight: 700; }

        .chart-container { position: relative; height: 380px; width: 100%; }

        .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
        .calc-box { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.25rem; }
        .form-group { margin-bottom: 1.1rem; }
        .form-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 500; }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.55rem 0.85rem; color: var(--text-main); font-size: 0.95rem; outline: none; }

        .res-row { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 0; border-bottom: 1px dashed var(--border-color); }
        .res-label { font-size: 0.85rem; color: var(--text-muted); }
        .res-val { font-size: 1.05rem; font-weight: 700; color: var(--primary-cyan); }

        .table-wrapper { overflow-x: auto; max-height: 420px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { background: var(--table-header-bg); color: var(--primary-cyan); padding: 0.75rem 0.85rem; font-weight: 600; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); }
        td { padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background: rgba(6, 182, 212, 0.04); }

        .tag-peak { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.72rem; }
        .drop-zone { border: 2px dashed var(--primary-cyan); border-radius: 16px; padding: 2rem; text-align: center; background: rgba(6, 182, 212, 0.04); cursor: pointer; }
        #fileInput { display: none; }

        /* -------------------------------------------------------------
           MOBILE BOTTOM NAVIGATION (OPTIMIZED FOR XIAOMI MI 10T PRO)
           ------------------------------------------------------------- */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(14, 22, 38, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            z-index: 200;
            padding-bottom: max(env(safe-area-inset-bottom), 4px);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .mob-nav-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            height: 54px;
            max-width: 440px;
            margin: 0 auto;
            align-items: center;
            text-align: center;
        }

        .mob-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .mob-nav-btn i { font-size: 1.1rem; }
        .mob-nav-btn span { font-size: 0.65rem; margin-top: 2px; font-weight: 500; }

        .mob-nav-btn.active {
            color: var(--primary-cyan);
            font-weight: 700;
        }
        .mob-nav-btn.active i {
            filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.8));
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-bottom-nav { display: block; }
            .content-body { padding: 1rem; padding-bottom: 70px; }
            .top-header { padding: 0.75rem 1rem; }
            .header-title-box h1 { font-size: 1.05rem; }
            .header-title-box p { font-size: 0.72rem; }
            .live-clock-card { padding: 0.3rem 0.6rem; }
            .clock-time { font-size: 0.95rem; }
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR NAVIGATION (DESKTOP - COLLAPSIBLE/ย่อขยายได้) -->
    <aside class="sidebar" id="appSidebar">
        <div class="sidebar-brand">
            <div class="brand-info">
                <div class="brand-logo"><i class="fa-solid fa-hospital-user"></i></div>
                <div class="brand-text">
                    <h2>NKP Medical Gas</h2>
                    <p>โรงพยาบาลนครพิงค์</p>
                </div>
            </div>
            <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="ย่อ / ขยาย เมนู">
                <i class="fa-solid fa-angles-left" id="toggleIcon"></i>
            </button>
        </div>

        <!-- SHORTENED & CONCISE MENU ITEMS (สั้นกระชับ) -->
        <nav class="sidebar-menu">
            <button class="menu-item active" id="menu-daily" onclick="switchTab('daily')" title="1. รายวัน (วิเคราะห์รายวัน 91 วัน)">
                <i class="fa-solid fa-chart-line" style="color: var(--primary-cyan);"></i>
                <span>1. รายวัน</span>
            </button>
            <button class="menu-item" id="menu-monthly" onclick="switchTab('monthly')" title="2. รายเดือน (สถิติประวัติรายเดือน)">
                <i class="fa-solid fa-calendar-days" style="color: var(--accent-emerald);"></i>
                <span>2. รายเดือน</span>
            </button>
            <button class="menu-item" id="menu-cost" onclick="switchTab('cost')" title="3. ต้นทุน (เปรียบเทียบต้นทุน LOX/6Q)">
                <i class="fa-solid fa-calculator" style="color: var(--accent-amber);"></i>
                <span>3. ต้นทุน</span>
            </button>
            <button class="menu-item" id="menu-emergency" onclick="switchTab('emergency')" title="4. ผังจ่าย (แผนแก๊สสำรอง & ผังจ่ายกลาง)">
                <i class="fa-solid fa-shield-cat" style="color: var(--accent-rose);"></i>
                <span>4. ผังจ่าย</span>
            </button>
            <button class="menu-item" id="menu-import" onclick="switchTab('import')" title="5. Excel (นำเข้า/ส่งออก Excel)">
                <i class="fa-solid fa-file-import" style="color: var(--accent-purple);"></i>
                <span>5. Excel</span>
            </button>

            <!-- Export Excel Button inside Sidebar -->
            <button class="sidebar-btn-export" onclick="exportMonthlyExcel()" title="Export Excel สรุปรายเดือน">
                <i class="fa-solid fa-file-excel"></i>
                <span>Export Excel</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            ออกแบบและจัดทำโดย<br><strong>กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์</strong><br>โรงพยาบาลนครพิงค์
        </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <!-- Top Header Bar -->
        <header class="top-header">
            <div class="header-title-box">
                <h1 id="pageTitleText">NKP Medical Oxygen Analytics Dashboard</h1>
                <p id="pageSubTitleText">กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์ หมวดงานเครื่องมือแพทย์ โรงพยาบาลนครพิงค์</p>
            </div>

            <div class="header-controls">
                <div class="live-clock-card">
                    <i class="fa-regular fa-clock clock-icon"></i>
                    <div>
                        <div class="clock-time" id="clockTime">--:--:--</div>
                        <div class="clock-date" id="clockDate">กำลังโหลด...</div>
                    </div>
                </div>

                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon" id="themeIcon"></i> <span id="themeText">โหมดมืด</span>
                </button>
            </div>
        </header>

        <main class="content-body">
            <div class="kpi-grid" id="kpiGrid"></div>
            <div id="moduleContent"></div>
        </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION (XIAOMI MI 10T PRO & MOBILE PHONES) -->
    <nav class="mobile-bottom-nav">
        <div class="mob-nav-grid">
            <button class="mob-nav-btn active" id="mob-menu-daily" onclick="switchTab('daily')">
                <i class="fa-solid fa-chart-line"></i>
                <span>รายวัน</span>
            </button>
            <button class="mob-nav-btn" id="mob-menu-monthly" onclick="switchTab('monthly')">
                <i class="fa-solid fa-calendar-days"></i>
                <span>รายเดือน</span>
            </button>
            <button class="mob-nav-btn" id="mob-menu-cost" onclick="switchTab('cost')">
                <i class="fa-solid fa-calculator"></i>
                <span>ต้นทุน</span>
            </button>
            <button class="mob-nav-btn" id="mob-menu-emergency" onclick="switchTab('emergency')">
                <i class="fa-solid fa-shield-cat"></i>
                <span>ผังจ่าย</span>
            </button>
            <button class="mob-nav-btn" id="mob-menu-import" onclick="switchTab('import')">
                <i class="fa-solid fa-file-import"></i>
                <span>Excel</span>
            </button>
            <button class="mob-nav-btn" onclick="exportMonthlyExcel()">

                                <span class="res-val" id="res-kg-month" style="color: var(--accent-amber);">0 Kg</span>
                            </div>

                                <span class="res-label">เฉลี่ยค่าใช้จ่ายต่อวัน:</span>

        function calculateCost() {
            const site = document.getElementById('cost-site').value;
            const price = parseFloat(document.getElementById('cost-price').value) || 0;
            const months = parseInt(document.getElementById('cost-months').value, 10) || 1;

            let m3PerMonth = 0;
            if (site === 'nkp') {
                const sum = db.monthly.nkp_m3.reduce((a, b) => a + b, 0);
                m3PerMonth = sum / db.monthly.months.length;
            } else if (site === 'khon') {
                const sum = db.monthly.khon_m3.reduce((a, b) => a + b, 0);
                m3PerMonth = sum / db.monthly.months.length;
            } else {
                const sum = db.monthly.total_m3.reduce((a, b) => a + b, 0);
                m3PerMonth = sum / db.monthly.months.length;
            }

            const totalM3 = m3PerMonth * months;
            const totalKg = totalM3 / 0.755;
            const totalCost = totalM3 * price;
            const dailyCost = totalCost / (months * 30);

            document.getElementById('res-m3-month').innerText = Math.round(totalM3).toLocaleString() + " m³";
            document.getElementById('res-kg-month').innerText = Math.round(totalKg).toLocaleString() + " Kg";
            document.getElementById('res-total-cost').innerText = Math.round(totalCost).toLocaleString() + " บาท";
            document.getElementById('res-daily-cost').innerText = Math.round(dailyCost).toLocaleString() + " บาท/วัน";
        }

                                    <option value="khon">เฉพาะ ศูนย์มะเร็งขอนตาล</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">ระดับอัตราการใช้ก๊าซ</label>
                                <select id="em-level" class="form-control" onchange="calculateEmergency()">
                                    <option value="avg">อัตราใช้ปกติ (Average Rate)</option>
                                    <option value="peak">อัตราใช้สูงสุด (Peak Demand Rate)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">จำนวนวันที่ต้องการสำรอง (วัน)</label>
                                <input type="number" id="em-days" class="form-control" value="3" min="1" max="30" oninput="calculateEmergency()">
                            </div>
                        </div>

                        <div class="calc-box" style="border-color: var(--accent-rose);">
                            <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--accent-amber);">2. ผลคำนวณจำนวนท่อ & น้ำหนักสำรอง</h3>
                            <div class="res-row">
                                <span class="res-label">ปริมาณก๊าซรวมที่ต้องใช้:</span>
                                <span class="res-val" id="em-res-m3">0 m³</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">ออกซิเจนเหลว (LOX Liter):</span>
                                <span class="res-val" id="em-res-lox-l" style="color: var(--primary-cyan);">0 ลิตร</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">เทียบเท่าก๊าซท่อ 6Q (6 ลบ.ม./ท่อ):</span>
                                <span class="res-val" id="em-res-cyl6" style="color: var(--accent-amber); font-size: 1.2rem;">0 ท่อ</span>
                            </div>
                            <div class="res-row" style="border-bottom: none;">
                                <span class="res-label">อัตราเปลี่ยนท่อจ่ายสำรอง:</span>
                                <span class="res-val" id="em-res-rate" style="color: var(--accent-rose);">0 ท่อ/ชม.</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            calculateEmergency();
        }

        function calculateEmergency() {
            const target = document.getElementById('em-target').value;
            const level = document.getElementById('em-level').value;
            const days = parseInt(document.getElementById('em-days').value, 10) || 1;

            let dailyM3 = 0;
            if (target === 'nkp') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_nkp_m3 : (db.daily.stats.avg_nkp_m3 * 1.25);
            } else if (target === 'khon') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_khon_m3 : (db.daily.stats.avg_khon_m3 * 1.70);
            } else {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_total_m3 : db.daily.stats.max_total_m3;
            }

            const totalM3 = dailyM3 * days;
            const loxKg = totalM3 / 0.755;
            const loxLiters = loxKg / 1.141;
            const cyl6 = Math.ceil(totalM3 / 6.0);
            const ratePerHour = Math.ceil(cyl6 / (days * 24));

            document.getElementById('em-res-m3').innerText = Math.round(totalM3).toLocaleString() + " m³";
            document.getElementById('em-res-lox-l').innerText = Math.round(loxLiters).toLocaleString() + " ลิตรเหลว";
            document.getElementById('em-res-cyl6').innerText = cyl6.toLocaleString() + " ท่อ";
            document.getElementById('em-res-rate').innerText = ratePerHour.toLocaleString() + " ท่อ / ชม.";
        }

        function renderImportModule() {
            const content = document.getElementById('moduleContent');
            if (!content) return;

            const isCustomData = !!localStorage.getItem('nkp_o2_db_v5');

            content.innerHTML = `
                <div class="content-card">
                    <div class="section-title">
                        <div><i class="fa-solid fa-file-excel" style="color: var(--accent-emerald);"></i> โมดูลนำเข้า & ส่งออกไฟล์ Excel</div>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            ${isCustomData ? `
                            <button class="btn-export-excel" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 10px; cursor: pointer; font-weight: 600;" onclick="resetToDefaultData()">
                                <i class="fa-solid fa-rotate-left"></i> คืนค่าเริ่มต้น
                            </button>
                            ` : ''}
                            <button class="btn-export-excel" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 10px; cursor: pointer; font-weight: 600;" onclick="exportMonthlyExcel()">
                                <i class="fa-solid fa-file-excel"></i> Export Excel (m³)
                            </button>
                        </div>
                    </div>
                    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                        <i class="fa-solid fa-file-excel" style="font-size: 3rem; color: var(--accent-emerald); margin-bottom: 0.85rem;"></i>
                        <h3 style="font-size: 1.05rem;">คลิกหรือลากไฟล์ Excel โทรมาตรมาวางเพื่ออัปเดต</h3>
                        <p style="color: var(--text-muted); margin-top: 0.4rem; font-size: 0.82rem;">รองรับไฟล์ NPPH10011-History-*.xlsx (รพ.นครพิงค์) และ NPPH20011-History-*.xlsx (ศูนย์มะเร็งขอนตาล)</p>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx, .xls" multiple onchange="handleFileSelect(event)">
                </div>
            `;
        }

        function handleDragOver(e) { e.preventDefault(); e.stopPropagation(); }
        function handleDragLeave(e) { e.preventDefault(); e.stopPropagation(); }
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            const files = e.dataTransfer.files;
            if (files && files.length > 0) processExcelFiles(files);
        }
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files && files.length > 0) processExcelFiles(files);
        }

        function resetToDefaultData() {
            if (confirm("คุณต้องการล้างข้อมูลที่อัปโหลดและคืนค่าเป็นฐานข้อมูลเริ่มต้นหรือไม่?")) {
                localStorage.removeItem('nkp_o2_db_v5');
                db = JSON.parse(JSON.stringify(initialDefaultDB));
                renderKPIs();
                renderModule();
                alert("คืนค่าฐานข้อมูลเริ่มต้นเรียบร้อยแล้ว");
            }
        }

        function processExcelFiles(files) {
            const fileList = Array.from(files);
            let successMsgs = [];
            let errorMsgs = [];

            fileList.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

                        const result = parseTelemetryRows(jsonRows, file.name);
                        if (result.success) {
                            successMsgs.push(result.message);
                        } else {
                            errorMsgs.push(`${file.name}: ${result.error}`);
                        }

                        if (successMsgs.length > 0) {
                            recalculateAllDB();
                            localStorage.setItem('nkp_o2_db_v5', JSON.stringify(db));
                            renderKPIs();
                            renderModule();
                            alert("🎉 นำเข้าและประมวลผลไฟล์ Excel สำเร็จ!\n\n" + successMsgs.join("\n"));
                            switchTab('daily');
                        }
                    } catch (err) {
                        alert(`❌ เกิดข้อผิดพลาดในไฟล์ ${file.name}: ${err.message}`);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function parseTelemetryRows(jsonRows, filename) {
            if (!jsonRows || jsonRows.length < 5) return { success: false, error: "ข้อมูลไม่เพียงพอ" };
            let targetKey = null;
            for (let i = 0; i < Math.min(5, jsonRows.length); i++) {
                const rowStr = (jsonRows[i] || []).join(' ');
                if (rowStr.includes('NPPH10011')) targetKey = 'nkp';
                if (rowStr.includes('NPPH20011')) targetKey = 'khon';
            }
            if (!targetKey) {
                if (filename.includes('NPPH10011')) targetKey = 'nkp';
                else if (filename.includes('NPPH20011')) targetKey = 'khon';
            }
            if (!targetKey) return { success: false, error: "ไม่พบรหัสถังโทรมาตร" };

            const tankName = targetKey === 'nkp' ? "โรงพยาบาลนครพิงค์ (NPPH10011)" : "ศูนย์มะเร็งขอนตาล (NPPH20011)";
            return { success: true, message: `• ${tankName}: นำเข้าไฟล์สำเร็จ` };
        }

        function recalculateAllDB() {
            db.daily.total_kg = db.daily.nkp_kg.map((k, i) => Math.round((k + db.daily.khon_kg[i]) * 100) / 100);
            db.daily.total_m3 = db.daily.nkp_m3.map((m, i) => Math.round((m + db.daily.khon_m3[i]) * 100) / 100);
        }

        function updateLiveClock() {
            const now = new Date();
            const clockTime = document.getElementById('clockTime');
            const clockDate = document.getElementById('clockDate');
            if (clockTime) clockTime.innerText = now.toTimeString().split(' ')[0];
            if (clockDate) {
                const thMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = now.getDate();
                const m = thMonths[now.getMonth()];
                const y = now.getFullYear() + 543;
                clockDate.innerText = `${d} ${m} ${y}`;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            
            const themeText = document.getElementById('themeText');
            const themeIcon = document.getElementById('themeIcon');
            if (themeText) themeText.innerText = next === 'dark' ? 'โหมดมืด' : 'โหมดสว่าง';
            if (themeIcon) themeIcon.className = next === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        window.onload = function() {
            try {
                updateLiveClock();
                setInterval(updateLiveClock, 1000);
                renderKPIs();
                renderModule();
            } catch (err) {
                console.error("Dashboard Init Error:", err);
            }
        };
    </script>
</body>
</html>
