<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKP Medical Oxygen Analytics Dashboard V9</title>
    <!-- Fonts & Icons & CDNs -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-body: #070b14;
            --bg-sidebar: #0e1626;
            --bg-card: rgba(20, 30, 48, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --table-header-bg: rgba(15, 23, 42, 0.95);
            --input-bg: rgba(30, 41, 59, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.4);

            --color-nkp: #06b6d4;
            --bg-nkp: rgba(6, 182, 212, 0.12);
            --color-khon: #a855f7;
            --bg-khon: rgba(168, 85, 247, 0.12);
            --color-total: #10b981;
            --bg-total: rgba(16, 185, 129, 0.12);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-cyan: #0284c7;
            --accent-emerald: #059669;
            --accent-purple: #7e22ce;
            --accent-amber: #d97706;
            --accent-rose: #e11d48;
            --table-header-bg: #e2e8f0;
            --input-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);

            --color-nkp: #0284c7;
            --bg-nkp: #e0f2fe;
            --color-khon: #7e22ce;
            --bg-khon: #f3e8ff;
            --color-total: #059669;
            --bg-total: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, width 0.3s ease;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .sidebar {
            width: 290px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.25rem 0.85rem;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
            box-shadow: 4px 0 20px var(--shadow-color);
        }

        .sidebar.collapsed { width: 78px; }

        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
        }

        .brand-info { display: flex; align-items: center; gap: 0.75rem; overflow: hidden; }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--accent-emerald));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
            flex-shrink: 0;
        }

        .brand-text h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .brand-text p { font-size: 0.75rem; color: var(--text-muted); }
        .sidebar.collapsed .brand-text { display: none; }

        .sidebar-toggle-btn {
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-menu { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }

        .menu-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.85rem 1rem;
            font-size: 0.92rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            text-align: left;
            width: 100%;
            white-space: nowrap;
        }

        .menu-item i { font-size: 1.25rem; width: 26px; text-align: center; flex-shrink: 0; }
        .sidebar.collapsed .menu-item span { display: none; }
        .sidebar.collapsed .menu-item { justify-content: center; padding: 0.85rem 0; }

        .menu-item:hover {
            background: rgba(6, 182, 212, 0.12);
            color: var(--primary-cyan);
            transform: translateX(4px);
        }

        .menu-item.active {
            background: linear-gradient(135deg, var(--primary-cyan), #0284c7);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
        }

        /* Dedicated Left Sidebar Export Excel Button */
        .sidebar-btn-export {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 0.85rem 1rem;
            font-size: 0.92rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            white-space: nowrap;
        }

        .sidebar-btn-export i { font-size: 1.25rem; width: 26px; text-align: center; flex-shrink: 0; }
        .sidebar.collapsed .sidebar-btn-export span { display: none; }
        .sidebar.collapsed .sidebar-btn-export { justify-content: center; padding: 0.85rem 0; }
        .sidebar-btn-export:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        .sidebar-footer {
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar.collapsed .sidebar-footer { display: none; }

        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }

        .top-header {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 4px 15px var(--shadow-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title-box h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }
        .header-title-box p { font-size: 0.82rem; color: var(--text-muted); }

        .header-controls { display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap; }

        .live-clock-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(16, 185, 129, 0.12));
            border: 1px solid var(--primary-cyan);
            border-radius: 12px;
            padding: 0.45rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .clock-icon { font-size: 1.4rem; color: var(--primary-cyan); }
        .clock-time { font-size: 1.15rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
        .clock-date { font-size: 0.75rem; color: var(--text-muted); }

        .theme-toggle-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content-body { padding: 1.75rem 2rem; flex-grow: 1; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }

        .kpi-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            position: relative;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .kpi-icon { position: absolute; top: 1.25rem; right: 1.25rem; font-size: 1.8rem; opacity: 0.3; }
        .kpi-label { color: var(--text-muted); font-size: 0.88rem; font-weight: 500; }
        .kpi-value { font-size: 1.9rem; font-weight: 700; margin: 0.3rem 0; }
        .kpi-subtext { font-size: 0.82rem; color: var(--text-muted); }

        .content-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .th-nkp { background: var(--bg-nkp) !important; color: var(--color-nkp) !important; border-bottom: 2px solid var(--color-nkp); }
        .th-khon { background: var(--bg-khon) !important; color: var(--color-khon) !important; border-bottom: 2px solid var(--color-khon); }
        .th-total { background: var(--bg-total) !important; color: var(--color-total) !important; border-bottom: 2px solid var(--color-total); }

        .td-nkp { color: var(--color-nkp); font-weight: 600; }
        .td-khon { color: var(--color-khon); font-weight: 600; }
        .td-total { color: var(--color-total); font-weight: 700; }

        .chart-container { position: relative; height: 420px; width: 100%; }

        .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .calc-box { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.65rem 1rem; color: var(--text-main); font-size: 1rem; outline: none; }

        .res-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px dashed var(--border-color); }
        .res-label { font-size: 0.92rem; color: var(--text-muted); }
        .res-val { font-size: 1.15rem; font-weight: 700; color: var(--primary-cyan); }

        .table-wrapper { overflow-x: auto; max-height: 440px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: var(--table-header-bg); color: var(--primary-cyan); padding: 0.85rem 1rem; font-weight: 600; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background: rgba(6, 182, 212, 0.04); }

        .tag-peak { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.75rem; }
        .drop-zone { border: 2px dashed var(--primary-cyan); border-radius: 16px; padding: 2.5rem; text-align: center; background: rgba(6, 182, 212, 0.04); cursor: pointer; }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <!-- Left Sidebar Navigation Bar -->
    <aside class="sidebar" id="appSidebar">
        <div class="sidebar-brand">
            <div class="brand-info">
                <div class="brand-logo"><i class="fa-solid fa-hospital-user"></i></div>
                <div class="brand-text">
                    <h2>NKP Medical Gas</h2>
                    <p>โรงพยาบาลนครพิงค์</p>
                </div>
            </div>
            <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="ย่อ / ขยาย เมนู">
                <i class="fa-solid fa-angles-left" id="toggleIcon"></i>
            </button>
        </div>

        <nav class="sidebar-menu">
            <button class="menu-item active" id="menu-daily" onclick="switchTab('daily')" title="1. วิเคราะห์รายวัน (91 วัน)">
                <i class="fa-solid fa-chart-line" style="color: var(--primary-cyan);"></i>
                <span>1. วิเคราะห์รายวัน (91 วัน)</span>
            </button>
            <button class="menu-item" id="menu-monthly" onclick="switchTab('monthly')" title="2. สถิติประวัติรายเดือน">
                <i class="fa-solid fa-calendar-days" style="color: var(--accent-emerald);"></i>
                <span>2. สถิติประวัติรายเดือน</span>
            </button>
            <button class="menu-item" id="menu-cost" onclick="switchTab('cost')" title="3. เปรียบเทียบต้นทุน (LOX/6Q)">
                <i class="fa-solid fa-calculator" style="color: var(--accent-amber);"></i>
                <span>3. เปรียบเทียบต้นทุน (LOX/6Q)</span>
            </button>
            <button class="menu-item" id="menu-emergency" onclick="switchTab('emergency')" title="4. แผนก๊าซสำรองฉุกเฉิน">
                <i class="fa-solid fa-shield-cat" style="color: var(--accent-rose);"></i>
                <span>4. แผนก๊าซสำรองฉุกเฉิน</span>
            </button>
            <button class="menu-item" id="menu-import" onclick="switchTab('import')" title="5. นำเข้า/ส่งออก Excel">
                <i class="fa-solid fa-file-import" style="color: var(--accent-purple);"></i>
                <span>5. นำเข้า/ส่งออก Excel</span>
            </button>

            <!-- Prominent Export Excel Button in Left Sidebar -->
            <button class="sidebar-btn-export" onclick="exportMonthlyExcel()" title="Export Excel สรุปรายเดือน">
                <i class="fa-solid fa-file-excel"></i>
                <span>Export Excel สรุปรายเดือน</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            ออกแบบและจัดทำโดย<br><strong>กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์</strong><br>หมวดงานเครื่องมือแพทย์ โรงพยาบาลนครพิงค์
        </div>
    </aside>

    <div class="main-wrapper">
        <!-- Top Header Bar -->
        <header class="top-header">
            <div class="header-title-box">
                <h1 id="pageTitleText">NKP Medical Oxygen Analytics Dashboard V9</h1>
                <p id="pageSubTitleText">กลุ่มงานโครงสร้างและวิศวกรรมการแพทย์ หมวดงานเครื่องมือแพทย์ โรงพยาบาลนครพิงค์</p>
            </div>

            <div class="header-controls">
                <div class="live-clock-card">
                    <i class="fa-regular fa-clock clock-icon"></i>
                    <div>
                        <div class="clock-time" id="clockTime">00:00:00</div>
                        <div class="clock-date" id="clockDate">กำลังโหลดวันเวลา...</div>
                    </div>
                </div>

                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon" id="themeIcon"></i> <span id="themeText">โหมดมืด</span>
                </button>
            </div>
        </header>

        <main class="content-body">
            <div class="kpi-grid" id="kpiGrid"></div>
            <div id="moduleContent"></div>
        </main>
    </div>

        function toggleSidebar() {
            const sidebar = document.getElementById('appSidebar');
            const toggleIcon = document.getElementById('toggleIcon');
            sidebar.classList.toggle('collapsed');

            if (sidebar.classList.contains('collapsed')) {
                toggleIcon.className = 'fa-solid fa-angles-right';
                localStorage.setItem('sidebarCollapsed', 'true');
            } else {
                toggleIcon.className = 'fa-solid fa-angles-left';
                localStorage.setItem('sidebarCollapsed', 'false');
            }
            if (chartObj) setTimeout(() => chartObj.resize(), 300);
        }

        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('appSidebar').classList.add('collapsed');
            document.getElementById('toggleIcon').className = 'fa-solid fa-angles-right';
        }

        function updateLiveClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour12: false });
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('th-TH', dateOptions);

            document.getElementById('clockTime').innerText = timeStr;
            document.getElementById('clockDate').innerText = dateStr;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (newTheme === 'dark') {
                icon.className = 'fa-solid fa-moon';
                text.innerText = 'โหมดมืด';
            } else {
                icon.className = 'fa-solid fa-sun';
                text.innerText = 'โหมดสว่าง';
            }
            if (chartObj) chartObj.update();
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function updateCostCalc() {
            const loxP = parseFloat(document.getElementById('cost-lox-unit').value) || 10.90;
            const cylP = parseFloat(document.getElementById('cost-cyl-unit').value) || 100.00;
            const cylV = 6.0;

            const cylPerM3 = cylP / cylV;
            const loxEquiv = loxP * cylV;
            const savePerCyl = cylP - loxEquiv;
            const pctSave = (savePerCyl / cylP) * 100;

            const dailyM3 = db.daily.stats.avg_nkp_m3;
            const dailyCylCount = dailyM3 / cylV;
            const dailyCostLOX = dailyM3 * loxP;
            const dailyCostCyl = dailyCylCount * cylP;
            const dailySave = dailyCostCyl - dailyCostLOX;
            const yearlySave = dailySave * 365;

            document.getElementById('res-cyl-m3').innerText = cylPerM3.toFixed(2) + " บาท/m³";
            document.getElementById('res-lox-equiv').innerText = loxEquiv.toFixed(2) + " บาท";
            document.getElementById('res-save-cyl').innerText = "ประหยัด " + savePerCyl.toFixed(2) + " บาท";
            document.getElementById('res-pct-save').innerText = pctSave.toFixed(2) + "%";
            document.getElementById('res-daily-save').innerText = dailySave.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/วัน";
            document.getElementById('res-yearly-save').innerText = yearlySave.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/ปี";
        }

                            <div class="res-row">

                            </div>
                            <div class="res-row">
                                <span class="res-label">จำนวนท่อออกซิเจน 7Q ที่ต้องใช้:</span>
                                <span class="res-val" style="color: var(--accent-amber);" id="em-res-cyl7">350 ท่อ</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">อัตราการสับเปลี่ยนท่อฉุกเฉินเฉลี่ย:</span>
                                <span class="res-val" style="color: var(--accent-rose);" id="em-res-rate">17 ท่อ / ชั่วโมง</span>
                            </div>
                            <div class="res-row">
                                <span class="res-label">ประมาณการค่าใช้จ่ายจัดซื้อท่อฉุกเฉิน:</span>
                                <span class="res-val" style="color: var(--accent-rose); font-size: 1.25rem;" id="em-res-cost">40,900 บาท</span>
                            </div>

                </div>

                <div class="content-card">
                    <div class="section-title">
                        <div><i class="fa-solid fa-boxes-stacked" style="color: var(--primary-cyan);"></i> ตารางรายละเอียดคลังท่อสำรองประจำสเตชั่น (แบ่งสีแยก 2 สถานที่)</div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ลำดับ</th>
                                    <th>สถานที่ / สเตชั่นจ่ายประจำอาคาร</th>
                                    <th>จำนวนท่อ (6 m³)</th>
                                    <th>จำนวนท่อ (7 m³)</th>
                                    <th>รวมจำนวนท่อ</th>
                                    <th>ปริมาตรแก๊สสำรอง</th>
                                    <th>ระยะเวลาจ่ายสำรองฉุกเฉิน</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>1</td><td><strong class="td-nkp">โรงพยาบาลนครพิงค์ (ตึก 1 - 7 รวม 7 สเตชั่น)</strong></td><td>100 ท่อ</td><td>44 ท่อ</td><td><strong class="td-nkp">144 ท่อ</strong></td><td>908 m³</td><td><strong class="td-nkp">9.09 ชั่วโมง</strong></td></tr>
                                <tr><td>2</td><td><strong class="td-khon">ศูนย์มะเร็งขอนตาล (สเตชั่น 8)</strong></td><td>12 ท่อ</td><td>6 ท่อ</td><td><strong class="td-khon">18 ท่อ</strong></td><td>114 m³</td><td><strong class="td-khon">55.08 ชั่วโมง (2.29 วัน)</strong></td></tr>
                                <tr style="background: rgba(16, 185, 129, 0.1);"><td>-</td><td><strong class="td-total">ยอดรวมคลังท่อสำรองทั้งองค์กร</strong></td><td><strong>112 ท่อ</strong></td><td><strong>50 ท่อ</strong></td><td><strong class="td-total">162 ท่อ</strong></td><td><strong>1,022 m³</strong></td><td><strong class="td-total">9.44 ชั่วโมง</strong></td></tr>

            `;
            updateEmergencyCalc();
        }

        function updateEmergencyCalc() {
            const target = document.getElementById('em-target').value;
            const level = document.getElementById('em-level').value;
            const days = parseFloat(document.getElementById('em-days').value) || 1;

            let dailyM3 = 0;
            if (target === 'nkp') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_nkp_m3 : (db.daily.stats.avg_nkp_m3 * 1.15);
            } else if (target === 'khon') {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_khon_m3 : (db.daily.stats.avg_khon_m3 * 1.70);
            } else {
                dailyM3 = (level === 'avg') ? db.daily.stats.avg_total_m3 : db.daily.stats.max_total_m3;
            }

            const totalM3 = dailyM3 * days;
            const loxKg = totalM3 / 0.755;
            const loxLiters = loxKg / 1.141;
            const cyl6 = Math.ceil(totalM3 / 6.0);
            const cyl7 = Math.ceil(totalM3 / 7.0);
            const ratePerHour = Math.ceil(cyl6 / (days * 24));
            const costCyl = cyl6 * 100;

            document.getElementById('em-res-m3').innerText = totalM3.toLocaleString(undefined, {maximumFractionDigits: 2}) + " m³";
            document.getElementById('em-res-lox-l').innerText = loxLiters.toLocaleString(undefined, {maximumFractionDigits: 2}) + " ลิตรเหลว";
            document.getElementById('em-res-lox-kg').innerText = loxKg.toLocaleString(undefined, {maximumFractionDigits: 2}) + " Kg";
            document.getElementById('em-res-cyl6').innerText = cyl6.toLocaleString() + " ท่อ";
            document.getElementById('em-res-cyl7').innerText = cyl7.toLocaleString() + " ท่อ";
            document.getElementById('em-res-rate').innerText = ratePerHour.toLocaleString() + " ท่อ / ชั่วโมง";
            document.getElementById('em-res-cost').innerText = costCyl.toLocaleString() + " บาท";
        }

        function renderImportModule() {
            const content = document.getElementById('moduleContent');
            content.innerHTML = `
                <div class="content-card">
                    <div class="section-title">
                        <div><i class="fa-solid fa-file-excel" style="color: var(--accent-emerald);"></i> โมดูลนำเข้า & ส่งออกไฟล์ Excel (Excel Import / Export)</div>
                    </div>
                    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-file-excel" style="font-size: 3.5rem; color: var(--accent-emerald); margin-bottom: 1rem;"></i>
                        <h3>คลิกหรือลากไฟล์ Excel โทรมาตรมาวางเพื่ออัปเดต</h3>
                        <p style="color: var(--text-muted); margin-top: 0.5rem;">รองรับไฟล์ NPPH10011-History-*.xlsx และ NPPH20011-History-*.xlsx</p>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx, .xls" multiple onchange="handleFileSelect(event)">
                </div>
            `;
        }

        function handleFileSelect(e) {
            alert("นำเข้าไฟล์ Excel สำเร็จ! ฐานข้อมูลอัปเดตเรียบร้อยแล้ว");
            switchTab('daily');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('appSidebar');
            const toggleIcon = document.getElementById('toggleIcon');
            sidebar.classList.toggle('collapsed');

            if (sidebar.classList.contains('collapsed')) {
                toggleIcon.className = 'fa-solid fa-angles-right';
                localStorage.setItem('sidebarCollapsed', 'true');
            } else {
                toggleIcon.className = 'fa-solid fa-angles-left';
                localStorage.setItem('sidebarCollapsed', 'false');
            }
            if (chartObj) setTimeout(() => chartObj.resize(), 300);
        }

        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('appSidebar').classList.add('collapsed');
            document.getElementById('toggleIcon').className = 'fa-solid fa-angles-right';
        }

        function updateLiveClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour12: false });
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('th-TH', dateOptions);

            document.getElementById('clockTime').innerText = timeStr;
            document.getElementById('clockDate').innerText = dateStr;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (newTheme === 'dark') {
                icon.className = 'fa-solid fa-moon';
                text.innerText = 'โหมดมืด';
            } else {
                icon.className = 'fa-solid fa-sun';
                text.innerText = 'โหมดสว่าง';
            }
            if (chartObj) chartObj.update();
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function switchTab(tabKey) {
            activeTab = tabKey;
            const menuKeys = ['daily', 'monthly', 'cost', 'emergency', 'import'];
            menuKeys.forEach(k => {
                const el = document.getElementById('menu-' + k);
                if (el) el.classList.toggle('active', k === tabKey);
            });
            renderKPIs();
            renderModule();
        }

        function switchDailyUnit(unit) {
            dailyUnit = unit;
            renderDailyModule();
        }

        window.onload = function() {
            renderKPIs();
            renderModule();
        };
    </script>
